en:
  imports:
    errors:
      already_imported: "%{path} has already been imported or is being imported"
      empty_file: "%{path} is empty. Expected %{expected}"
      file_not_found: "%{path} doesn't exist"
      movie_not_found: "Movie \"%{title}\" not found"
      not_csv: "%{path} is not a valid CSV file. Expected %{expected}"
      unknown_format: "%{path} has unrecognized headers (%{headers}). Expected %{expected}"
    report:
      imported: "%{kind} %{path}: %{status}, %{processed} rows, %{failed} failed"
      skipped: "%{kind} %{path}: skipped (already imported or being imported)"
      failure: "  line %{line}: %{errors}"
      more_failures:
        one: "  ... and 1 more failed row"
        other: "  ... and %{count} more failed rows"
      status_line: "#%{id} %{created_at} %{summary}"
      no_imports: "No imports yet"
    rake:
      queued: "Import queued (job %{job_id}). Follow it with bin/rails import:status or at /sidekiq"
      usage: 'Usage: bin/rails import:csv FILES="movies.csv reviews.csv" [INLINE=1]'
  ratings:
    recalculated:
      one: "Recalculated the ratings of 1 movie"
      other: "Recalculated the ratings of %{count} movies"
  layout:
    app_name: "Movies on Rails"
    navigation: "Main"
    nav:
      movies: "Movies"
    footer: "Movies on Rails · a movie review platform built with Ruby on Rails"
  movies:
    index:
      eyebrow: "Catalogue"
      title: "Movies"
      pages: "Pages"
      results:
        all:
          zero: "No movies"
          one: "1 movie"
          other: "%{count} movies"
        actor:
          zero: "No movies with %{actor}"
          one: "1 movie with %{actor}"
          other: "%{count} movies with %{actor}"
        matching:
          zero: "No movies with an actor matching \"%{text}\""
          one: "1 movie with an actor matching \"%{text}\""
          other: "%{count} movies with an actor matching \"%{text}\""
      empty_filter:
        title: "No movies with this actor"
        clear: "Show all movies"
      sort:
        label: "Sort movies"
        rating: "Best rated"
        title: "Title"
        newest: "Newest"
      empty:
        title: "No movies yet"
        hint_html: "Import them with %{command}"
        command: 'bin/rails import:csv FILES="movies.csv reviews.csv"'
    show:
      back: "← All movies"
      about: "About"
      reviews:
        zero: "Reviews"
        one: "1 review"
        other: "%{count} reviews"
      review_pages: "Review pages"
      no_text: "No comment"
      no_reviews: "No reviews yet"
    movie:
      directed_by: "Directed by %{director}"
      reviews_count:
        one: "1 review"
        other: "%{count} reviews"
      no_reviews: "No reviews yet"
      cast: "Cast"
      filmed_in: "Filmed in"
      filter_by: "Show movies with %{actor}"
      location: "%{name} (%{country})"
      separator: " · "
      more:
        one: "+1 more"
        other: "+%{count} more"
    filters:
      label: "Filter by actor"
      placeholder: "Search an actor…"
      hint: "Type at least %{count} letters"
      clear: "Clear actor filter"
  actors:
    index:
      movies_count:
        zero: "no movies"
        one: "1 movie"
        other: "%{count} movies"
      none: "No actors found"
  shared:
    stars:
      rated: "Rated %{average} out of %{max}"
      unrated: "Not rated yet"
  api:
    errors:
      invalid_parameter:
        one_of: "%{parameter} must be one of: %{values}"
        positive_integer: "%{parameter} must be a positive integer"
        min_length: "%{parameter} must have at least %{count} characters"
