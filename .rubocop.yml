# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Spec linting (rubocop-rspec, rubocop-factory_bot, rubocop-capybara)
plugins:
  - rubocop-rspec
  - rubocop-factory_bot
  - rubocop-capybara

AllCops:
  NewCops: enable

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# rswag specs pass every documented parameter (sort, actor_id, id…) through `let`
RSpec/MultipleMemoizedHelpers:
  Exclude:
    - spec/requests/api/**/*
